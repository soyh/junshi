name: TEST-135 validation

on:
  push:
    branches:
      - test-135-authenticated-product-shell

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: TEST-135 authenticated product shell
        run: pytest -q backend/tests/test_authenticated_product_shell.py
      - name: Auth UI regression
        run: pytest -q backend/tests/test_auth_account_ui.py
      - name: Provider UI regression
        run: pytest -q backend/tests/test_llm_provider_settings_ui.py
      - name: HTTP security regression
        run: pytest -q backend/tests/test_http_security_boundary.py
      - name: Account login regression
        run: pytest -q backend/tests/test_auth_account_login.py
      - name: Session management regression
        run: pytest -q backend/tests/test_auth_session_management.py
      - name: Password change regression
        run: pytest -q backend/tests/test_auth_password_change.py
      - name: Production auth regression
        run: pytest -q backend/tests/test_auth_boundary.py
      - name: Scope isolation regression
        run: pytest -q backend/tests/test_execution_scope_isolation.py backend/tests/test_action_plan_snapshot_isolation.py
      - name: Full test suite
        run: pytest -q
