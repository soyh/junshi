name: TEST-147 handover cleanup

on:
  push:
    branches:
      - test-147-full-lifecycle-release-acceptance
    paths:
      - .github/workflows/test-147-handover-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test-147-full-lifecycle-release-acceptance
          fetch-depth: 0

      - name: Remove stale pending language
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('DEVELOPMENT_HANDOVER.md')
          text = path.read_text(encoding='utf-8')

          old = '''### 服务器最终验收

PENDING。服务器必须验证：
- branch `test-147-full-lifecycle-release-acceptance` 与最终 handover HEAD；
- combined targeted 209；
- full 826；
- 对当前实际数据库先创建 fresh managed online backup，再运行 `python -m app.preflight --json`，必须返回 `ready=true`；
- 在当前 service 正常运行时，loopback `python -m app.probe live --json` 与 `ready --json` 必须成功；
- 不停止/切换当前进程，不执行 restore；
- `git diff --check` 与 `git status --short` 无输出；
- root `DEVELOPMENT_HANDOVER.md` 存在、duplicate handover 不存在；
- TEST-147 临时 workflows 不存在。

TEST-147 只有上述服务器验收全部通过后才可标记 VERIFIED。
'''

          new = '''### 服务器最终验收

2026-09-19 已完成并通过。实际服务器结果、managed backup、production release preflight、liveness/readiness 与 repository-clean 证据见本文末尾 `TEST-147 — Full Product Lifecycle E2E / Release Acceptance — VERIFIED` 正式记录。
'''

          if old not in text:
              raise SystemExit('stale TEST-147 pending server block not found')
          text = text.replace(old, new, 1)

          old_next = '''## 下一阶段

当前不创建 TEST-148。TEST-147 server VERIFIED 后，产品业务闭环与 release acceptance 基线即完整闭合。若进入实际发布，必须执行已 VERIFIED 的 TEST-134 release runbook；若继续新增阶段，必须先审计新的真实产品/运维缺口，不得为了延长 TEST 编号重复实现既有能力。
'''

          new_next = '''## 下一阶段

当前不创建 TEST-148。TEST-147 已 VERIFIED，产品业务闭环与 release acceptance 基线已经完整闭合。若进入实际发布，必须在用户明确要求后执行已 VERIFIED 的 TEST-134 release runbook；若继续新增阶段，必须先审计新的真实产品/运维缺口，不得为了延长 TEST 编号重复实现既有能力。
'''

          if old_next not in text:
              raise SystemExit('stale TEST-147 next-stage block not found')
          text = text.replace(old_next, new_next, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/test-147-handover-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOVER.md .github/workflows/test-147-handover-cleanup.yml
          git diff --cached --check
          git commit -m "docs: finalize TEST-147 handover state"
          git push origin HEAD:test-147-full-lifecycle-release-acceptance
