name: TEST-176 Provider Runtime Validation CI

on:
  push:
    branches:
      - test-176-provider-runtime-validation

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: TEST-176 focused
        run: pytest -q tests/test_provider_runtime_validation.py tests/test_llm_provider_config.py tests/test_multi_provider_byok.py tests/test_llm_provider_*.py tests/test_qwen_provider.py

      - name: Analysis and reply regression
        run: pytest -q tests/test_analysis_llm_service.py tests/test_analysis_structured_route.py tests/test_structured_analysis.py tests/test_analysis_strategic_reply.py tests/test_analysis_strategic_reply_route.py tests/test_strategic_reply_llm.py tests/test_strategic_reply_freshness.py tests/test_authenticated_reply_generation_recovery.py

      - name: Authenticated UI regression
        run: pytest -q tests/test_authenticated_*.py

      - name: Full suite
        run: pytest -q
