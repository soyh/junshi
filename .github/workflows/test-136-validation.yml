name: TEST-136 validation

on:
  push:
    branches:
      - test-136-authenticated-core-workspace

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: TEST-136 authenticated core workspace
        working-directory: backend
        run: pytest -q tests/test_authenticated_core_workspace.py
      - name: TEST-135 product shell regression
        working-directory: backend
        run: pytest -q tests/test_authenticated_product_shell.py
      - name: Canonical core resource regression
        working-directory: backend
        run: pytest -q tests/test_persons.py tests/test_relationships.py tests/test_conversations.py
      - name: Bearer account scope regression
        working-directory: backend
        run: pytest -q tests/test_auth_account_login.py
      - name: Full test suite from server-equivalent cwd
        working-directory: backend
        run: pytest -q
