name: TEST-148 finalize handover

on:
  push:
    branches:
      - test-148-platform-supervision-backup-scheduling

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update canonical handover
        run: python .github/test148_finalize_handover.py
      - name: Remove temporary finalizer
        run: |
          git rm .github/test148_finalize_handover.py
          git rm .github/workflows/test-148-finalize-handover.yml
      - name: Validate diff
        run: git diff --check
      - name: Commit verified handover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOVER.md
          git commit -m "docs: mark TEST-148 verified"
          git push origin HEAD:test-148-platform-supervision-backup-scheduling
