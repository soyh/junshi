name: TEST-152 finalize handover

on:
  push:
    branches:
      - test-152-product-management-completeness-finalize-tmp

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'docs: finalize TEST-152 verification handover') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-152-product-management-completeness-finalize-tmp
          fetch-depth: 0
      - name: Update canonical handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('DEVELOPMENT_HANDOVER.md')
          text = path.read_text(encoding='utf-8')

          text = re.sub(
              r'^当前阶段：.*$',
              '当前阶段：TEST-152 — Product Management Completeness — VERIFIED',
              text,
              count=1,
              flags=re.M,
          )
          text = re.sub(
              r'^当前 Branch：.*$',
              '当前 Branch：`test-152-product-management-completeness`',
              text,
              count=1,
              flags=re.M,
          )

          marker = '## TEST-152 — Product Management Completeness — VERIFIED'
          if marker not in text:
              block = r'''

## TEST-152 — Product Management Completeness — VERIFIED

用户明确要求“优先实现项目功能，最后再考虑环境数据迁移”。因此 TEST-152 从 TEST-150 VERIFIED 产品/生产基线继续，只补真实用户功能完整性；TEST-151 replacement-server bootstrap / environment-data migration 继续延期，不进入本阶段产品基线。

### 产品功能补齐

- 新增统一 `/app` 的 `Core Record Management`：Person / Relationship / Conversation / Interaction 的显式 Load / Update / Delete；Conversation 支持 archive / reactivate；Message 保持 evidence 不提供 PATCH，但支持显式删除后重录。
- Person / Relationship PATCH 语义统一到 canonical `UNSET` 边界：字段未提供与显式 `null` 分离；可空 nickname / notes / goals 等可被真正清空，不再出现“前端看似保存为空、后端实际保留旧值”。
- Person Profile 接入管理页面，继续读取 source-backed aggregate，不引入第二套 profile state。
- 新增 `Account Security`：用户可显式修改密码；服务端返回的新 session 被页面正确接续；Logout 会立即清空密码输入；可加载并单独撤销某一个其它 active session。
- 新增 Persisted Learning Memory history：已有 `memory_updates` 持久化数据现在可以按当前 user + Person 显式重新读取；读取不调用 LLM、不触发 Re-analysis、不发送消息、不修改 Relationship。
- 修复 Interaction 管理页状态同步：刷新列表后若原选中 Interaction 仍存在，会重新从服务端加载选中记录，Relationship / type / occurred_at / content 不会被局部 reset 后误保存。
- 统一产品导航与过期说明按已完成 canonical lifecycle 更新；没有为内部 synthesis / bridge API 机械复制第二套用户入口。

### GitHub verification

最终产品候选代码 HEAD：`bfab1ee55f91b0574c392d1fe08d5b16af458386`。

GitHub Actions run `35496707431`：
- TEST-152 focused：`17 passed`；
- authenticated product / CRUD regression：`134 passed`；
- full regression：`876 passed`；
- `git diff --check`：passed。

相对 TEST-150 post-verification handover baseline `9e9cfc81805e131a308c78f4ea981a9985373468`，有效 diff 仅为产品 API/service/repository/UI 与对应 tests；没有 historical migration、systemd、backup/restore、runtime environment 配置变化。temporary validation workflow 已清理。

### 2026-09-20 production server acceptance

固定验收结果 channel：branch `ops-server-acceptance-results`，file `ops/server_acceptance/latest.json`；result commit `35b419a725b6a4069fc3a22f325c633b7c61933c`。

- source branch：`test-152-product-management-completeness`；source HEAD：`bfab1ee55f91b0574c392d1fe08d5b16af458386`；status=`passed`。
- server isolated tests：focused `17`、product regression `134`、full `876`；pytest 使用 detached worktree + tmp SQLite，不读取/改写 production database。
- production switch 前 live / ready / preflight 均通过，并先创建 managed safety backup。
- 第一次 restart 失败已确认是 acceptance harness 自身造成：脚本手工默认 `app.backup` 后立即触发 systemd `ExecStartPre app.backup`，默认备份名只有秒级时间戳，managed manifest 明确拒绝同名覆盖，因此出现 same-second backup collision；固定结果明确记录 `product_code_failure=false`。
- retry 使用唯一文件名 safety backup，随后现有 systemd service 正常重启；最终 runtime PID `578548`；live / ready / preflight 全部成功；live `/app` 新功能 markers 已验证。
- backup timer 与 watchdog timer 继续 active。
- reserved port 8899 owner 仍为独立 PID `52822`，本阶段没有停止、修改、复用或接管。
- database restore：`NOT_EXECUTED`。
- environment/data migration：`NOT_EXECUTED`。
- historical migration：未修改。

### 结论

TEST-152 VERIFIED。当前产品功能基线已补齐：认证与账号安全、Person / Relationship / Conversation / Interaction / Message 管理、Text Import、Evidence / Timeline、Structured Analysis、Strategy / Recommendation、Action Plan、Decision、Execution、Outcome、Feedback、Learning、Persisted Learning history 与 Re-analysis 均已有统一 authenticated product surface，并保持唯一 canonical lifecycle 与 user/Person/Relationship/Conversation scope 边界。

后续继续坚持“产品功能优先”：只有审计出新的真实用户功能 gap 才继续产品阶段；replacement-server / environment-data migration / automatic migration / additional disaster-recovery work 全部延后到产品功能审计完成之后。
'''
              text = text.rstrip() + block + '\n'

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate handover
        run: |
          grep -Fq '当前阶段：TEST-152 — Product Management Completeness — VERIFIED' DEVELOPMENT_HANDOVER.md
          grep -Fq '## TEST-152 — Product Management Completeness — VERIFIED' DEVELOPMENT_HANDOVER.md
          grep -Fq '35b419a725b6a4069fc3a22f325c633b7c61933c' DEVELOPMENT_HANDOVER.md
          grep -Fq 'environment/data migration：`NOT_EXECUTED`' DEVELOPMENT_HANDOVER.md
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/test-152-finalize-handover.yml
          git add DEVELOPMENT_HANDOVER.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: finalize TEST-152 verification handover'
          git push origin HEAD:test-152-product-management-completeness-finalize-tmp
