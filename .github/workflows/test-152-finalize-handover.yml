name: TEST152 Finalize
on: [push]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-152-product-management-completeness-finalize-tmp
          fetch-depth: 0
      - run: python scripts/test152_finalize_handover.py
      - run: |
          git diff --check
          grep -Fq '当前阶段：TEST-152 — Product Management Completeness — VERIFIED' DEVELOPMENT_HANDOVER.md
          grep -Fq '35b419a725b6a4069fc3a22f325c633b7c61933c' DEVELOPMENT_HANDOVER.md
      - run: |
          git rm .github/workflows/test-152-finalize-handover.yml scripts/test152_finalize_handover.py
          git add DEVELOPMENT_HANDOVER.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: finalize TEST-152 verification handover'
          git push origin HEAD:test-152-product-management-completeness-finalize-tmp
