name: Publish TEST-229 verified candidate
on:
  push:
    branches: [publish-test-229-candidate]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0929710c97c4324c9816b481a7ebfec67700fc8d
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            for(const run_id of [38563554244,38563554241,38563554268]){
              let run;
              for(let i=0;i<60;i++){run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id})).data;if(run.status==='completed')break;await new Promise(r=>setTimeout(r,15000));}
              if(run.conclusion!=='success'||run.head_sha!=='0929710c97c4324c9816b481a7ebfec67700fc8d')throw new Error('Exact candidate checks did not pass');
            }
            fs.mkdirSync('release-files');
            for(const [run_id,name,dir] of [[38563554268,'JunshiPC-Windows-x64','pc'],[38563554241,'JunshiAndroid-1.0.0-rc4-debug','android']]){
              const all=(await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id})).data.artifacts;
              const a=all.find(x=>x.name===name&&!x.expired);if(!a||!a.digest)throw new Error('Artifact missing');
              const bytes=Buffer.from((await github.rest.actions.downloadArtifact({...context.repo,artifact_id:a.id,archive_format:'zip'})).data);
              if('sha256:'+crypto.createHash('sha256').update(bytes).digest('hex')!==a.digest)throw new Error('Artifact checksum mismatch');
              fs.writeFileSync(dir+'.zip',bytes);await exec.exec('unzip',['-q',dir+'.zip','-d',dir]);
            }
            fs.copyFileSync('android/app-debug.apk','release-files/JunshiAndroid-1.0.0-rc4-debug.apk');
            const pc=fs.readdirSync('pc').find(x=>x.endsWith('.zip'));if(!pc)throw new Error('PC zip missing');fs.copyFileSync('pc/'+pc,'release-files/'+pc);
            await exec.exec('git',['archive','--format=zip','--output=release-files/project-source-test229.zip','HEAD']);
            await exec.exec('git',['archive','--format=zip','--output=release-files/project-documents-test229.zip','HEAD','docs','README.md','android/RELEASE.md','desktop/CLIENT_README.txt']);
            await exec.exec('git',['branch','-f','test-229-account-style-user-picker','0929710c97c4324c9816b481a7ebfec67700fc8d']);
            await exec.exec('git',['bundle','create','release-files/test229.bundle','refs/heads/test-229-account-style-user-picker']);
            await exec.exec('git',['bundle','verify','release-files/test229.bundle']);
            const files=fs.readdirSync('release-files');
            fs.writeFileSync('release-files/SHA256SUMS.txt',files.map(n=>crypto.createHash('sha256').update(fs.readFileSync('release-files/'+n)).digest('hex')+'  '+n).join('\n')+'\n');
            const tag='test-229-account-interface';
            let release;
            try{release=(await github.rest.repos.getReleaseByTag({...context.repo,tag})).data;}catch(e){if(e.status!==404)throw e;release=(await github.rest.repos.createRelease({...context.repo,tag_name:tag,target_commitish:'0929710c97c4324c9816b481a7ebfec67700fc8d',name:'TEST-229 · unified account UI and user directory',draft:true,prerelease:true})).data;}
            const existing=(await github.rest.repos.listReleaseAssets({...context.repo,release_id:release.id})).data;
            for(const name of fs.readdirSync('release-files')){if(existing.some(x=>x.name===name))continue;const bytes=fs.readFileSync('release-files/'+name);await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name,data:bytes,headers:{'content-type':'application/octet-stream','content-length':bytes.length}});}
            await github.rest.repos.updateRelease({...context.repo,release_id:release.id,draft:false,body:'TEST-229 统一网页、PC、安卓邮箱账号按钮风格；管理员改用可搜索、分页的用户表格选择。GitHub CI 全量回归、全新安装、PC 与安卓构建通过。无新增迁移，数据库仍为 001–023。提供源码、文档、离线 Git bundle、PC 229、Android 1.0.0-rc4 与 SHA-256 清单。安卓为测试签名包。此版本尚未在生产服务器上线；私人配置、用户数据和密钥未包含。'});
