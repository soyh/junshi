name: TEST-169 Compact Surface CI

on:
  push:
    branches:
      - test-169-compact-conversation-results

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check compact surface JavaScript syntax
        run: |
          python - <<'PY'
          from app.ui.card_client_compact_surface import CARD_CLIENT_COMPACT_SURFACE_SCRIPT
          with open('/tmp/test169-compact-surface.js', 'w', encoding='utf-8') as fh:
              fh.write('(() => {\n')
              fh.write(CARD_CLIENT_COMPACT_SURFACE_SCRIPT)
              fh.write('\n})();\n')
          PY
          node --check /tmp/test169-compact-surface.js

      - name: Focused compact customer surface
        run: pytest -q tests/test_authenticated_card_client_compact_surface.py tests/test_authenticated_unified_conversation_import.py tests/test_authenticated_conversation_content_workspace.py tests/test_authenticated_card_client_experience.py

      - name: Lifecycle and automation regression
        run: pytest -q tests/test_authenticated_lifecycle_v2_workspace.py tests/test_authenticated_card_client_automation.py tests/test_authenticated_strategic_reply_workspace.py

      - name: Authenticated UI regression
        run: pytest -q tests/test_authenticated_*.py

      - name: Full suite
        run: pytest -q
