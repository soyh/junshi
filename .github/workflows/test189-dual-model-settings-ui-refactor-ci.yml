name: TEST-189 Dual Model Settings UI Refactor CI

on:
  push:
    branches:
      - test-189-dual-model-settings-ui-refactor
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify TEST-189 migration scope
        run: |
          changed="$(git -C .. diff --name-only 769140762010e122addb8586f536d524f5a5f618..HEAD -- backend/migrations)"
          printf 'migration changes:\n%s\n' "$changed"
          test -z "$changed"

      - name: Verify frontend refactor contract
        run: |
          grep -n '#guided-settings\[open\]' app/ui/settings_tab_workspace.py
          grep -n 'grid-column: 1 / -1' app/ui/settings_tab_workspace.py
          grep -n '文本推理与视觉理解独立配置' app/ui/dual_model_settings_workspace.py
          grep -n 'TEXT · 主路由' app/ui/dual_model_settings_workspace.py
          grep -n 'VISION · 多模态' app/ui/dual_model_settings_workspace.py
          grep -n "const existingPanelId = fieldset.id.trim" app/ui/settings_tab_workspace.py
          python - <<'PY'
          from app.ui.routes import PRODUCT_SHELL_WITH_CONTENT_HTML

          html = PRODUCT_SHELL_WITH_CONTENT_HTML
          assert 'id="provider"' in html
          assert "文本推理与视觉理解独立配置" in html
          assert "主文本 / 分析模型" in html
          assert "视觉 / 图片视频模型" in html
          assert "installSharedSettingsTabs();" in html
          assert "installMultiProviderSettings();" in html
          assert "installDualModelSettings();" in html
          assert html.index("installSharedSettingsTabs();") < html.index("installMultiProviderSettings();")
          assert html.index("installMultiProviderSettings();") < html.index("installDualModelSettings();")
          print("frontend refactor contract: PASS")
          PY

      - name: TEST-189 focused
        run: >-
          pytest -q
          tests/test_189_dual_model_settings_ui_refactor.py
          tests/test_188_dual_model_settings_tab_mount.py
          tests/test_180_media_upload_dual_model_settings_ui.py
          tests/test_179_vision_model_routing.py
          tests/test_authenticated_*.py

      - name: Full suite
        run: pytest -q
