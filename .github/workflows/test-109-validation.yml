name: TEST-109 validation

on:
  pull_request:
    branches:
      - test-108-provider-error-contract

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Targeted provider URL contract tests
        run: pytest -q backend/tests/test_llm_provider_url_contract.py
      - name: Full test suite
        run: pytest -q
