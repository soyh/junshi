name: TEST-156 Safety CI

on:
  push:
    branches:
      - test-156-first-user-end-to-end-validation
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Focused safety tests
        env:
          PYTHONPATH: backend
        run: |
          pytest -q \
            backend/tests/test_pytest_environment_safety.py \
            backend/tests/test_schema_drift_repair.py \
            backend/tests/test_runtime_health.py \
            backend/tests/test_analysis_structured_route.py \
            backend/tests/test_action_plan_snapshot_isolation.py

      - name: Auth regression
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_auth_*.py backend/tests/test_authenticated_*.py

      - name: Full suite
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests
