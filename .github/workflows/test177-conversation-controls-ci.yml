name: TEST-177 Conversation Controls CI

on:
  push:
    branches:
      - test-177-conversation-controls-multimodal

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: TEST-177 focused
        run: pytest -q tests/test_177_conversation_controls.py tests/test_conversations.py tests/test_authenticated_*.py

      - name: Full suite
        run: pytest -q
