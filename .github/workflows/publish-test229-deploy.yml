name: Publish TEST-229 deployment helper
on:
  push:
    branches: [publish-test229-deploy]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: df3af9549a1fc62c59d4980afca763da5e3e7c1e
      - run: |
          bash -n deploy/releases/test229/deploy.sh
          python deploy/releases/test229/check_script.py
          printf '%s  %s\n' d4095825eb74083c1a682505a45cdf6da6a3f802dae88453fb99578f7fdbe85b deploy/releases/test229/deploy.sh | sha256sum -c -
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const release=(await github.rest.repos.getReleaseByTag({...context.repo,tag:'test-229-account-interface'})).data;
            const name='deploy-test229.sh',bytes=fs.readFileSync('deploy/releases/test229/deploy.sh');
            const assets=(await github.rest.repos.listReleaseAssets({...context.repo,release_id:release.id})).data;
            if(!assets.some(x=>x.name===name))await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name,data:bytes,headers:{'content-type':'application/octet-stream','content-length':bytes.length}});
            const digest=crypto.createHash('sha256').update(bytes).digest('hex');
            const checksum=Buffer.from(digest+'  '+name+'\n');
            if(!assets.some(x=>x.name==='deploy-test229.sh.sha256'))await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name:'deploy-test229.sh.sha256',data:checksum,headers:{'content-type':'application/octet-stream','content-length':checksum.length}});
