name: TEST-146 post verification

on:
  push:
    branches:
      - test-146-reanalysis-workspace

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record server verification and self-clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('DEVELOPMENT_HANDOVER.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '当前阶段：TEST-146 — Re-analysis Workspace — GITHUB SELF-TEST PASSED / SERVER VALIDATION PENDING\n当前 Branch：`test-146-reanalysis-workspace`\nTEST-145 post-verification 基线：`ff33b34fa9896259cacd4dc4543486a8afc39df1`',
                  '当前阶段：TEST-146 — Re-analysis Workspace — VERIFIED\n当前 Branch：`test-146-reanalysis-workspace`\nTEST-146 VERIFIED 服务器代码/文档 HEAD：`8a58d056897a2cfbb09ba284c386fe01cb9cbcf7`\nTEST-145 post-verification 基线：`ff33b34fa9896259cacd4dc4543486a8afc39df1`'
              ),
              (
                  '- TEST-008 ~ TEST-145：按既有交接记录 VERIFIED。\n- TEST-146：GitHub self-test passed，服务器最终验收 pending。',
                  '- TEST-008 ~ TEST-146：按既有交接记录 VERIFIED。'
              ),
              (
                  '- TEST-145 VERIFIED：Learning Workspace。',
                  '- TEST-145 VERIFIED：Learning Workspace。\n- TEST-146 VERIFIED：Re-analysis Workspace。'
              ),
              (
                  '## TEST-146 — Re-analysis Workspace — GITHUB SELF-TEST PASSED / SERVER VALIDATION PENDING',
                  '## TEST-146 — Re-analysis Workspace — VERIFIED'
              ),
              (
                  '''### 服务器最终验收\n\nPENDING。服务器必须验证：\n- branch `test-146-reanalysis-workspace`；\n- 当前 GitHub handover HEAD；\n- combined targeted 183；\n- full 824；\n- `git diff --check` 无输出；\n- `git status --short` 无输出；\n- root `DEVELOPMENT_HANDOVER.md` 存在；\n- duplicate handover 不存在；\n- `.github/workflows/test-146-validation.yml` 不存在。\n\nTEST-146 只有上述服务器验收全部通过后才可标记 VERIFIED。''',
                  '''### 服务器最终验收\n\n2026-09-19 最终验收通过：\n- branch：`test-146-reanalysis-workspace`；\n- HEAD：`8a58d056897a2cfbb09ba284c386fe01cb9cbcf7`；\n- 初始 `git status --short` 无输出；\n- combined targeted：183 passed in 39.14s；\n- full：824 passed in 146.48s；\n- `git diff --check` 无输出；\n- 最终 `git status --short` 无输出；\n- `DEVELOPMENT_HANDOVER.md` 存在；\n- `docs/DEVELOPMENT_HANDOVER.md` 不存在；\n- `.github/workflows/test-146-validation.yml` 不存在。\n\nTEST-146 VERIFIED。'''
              ),
              (
                  '''## 下一阶段候选\n\nFull Product Lifecycle E2E / Release Acceptance。\n\n当前只记录候选方向，不创建下一阶段 branch，也不提前锁定 TEST 编号。必须先完成 TEST-146 服务器 VERIFIED；之后再审计现有 release preflight / runbook / runtime probe 与完整产品生命周期测试覆盖，确定最终 E2E / release acceptance 的精确 contract。''',
                  '''## 下一阶段候选\n\nFull Product Lifecycle E2E / Release Acceptance。\n\nTEST-146 已服务器 VERIFIED。下一步允许从本次 post-verification 提交建立新阶段，但必须先审计现有 release preflight / release runbook / runtime probe / backup-readiness 与完整产品生命周期 E2E 覆盖，再锁定下一 TEST 编号和精确 acceptance contract。不得再扩展新的业务生命周期阶段。'''
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected handover block: {old[:120]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "soyh"
          git config user.email "1227448394@qq.com"
          git rm .github/workflows/test-146-postverify.yml
          git add DEVELOPMENT_HANDOVER.md
          git diff --cached --check
          git commit -m "docs: mark TEST-146 server verified"
          git push origin HEAD:test-146-reanalysis-workspace
