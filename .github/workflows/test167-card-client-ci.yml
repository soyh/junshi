name: TEST-167 Card Client CI

on:
  push:
    branches:
      - test-167-card-persona-automated-client-experience

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check card client JavaScript syntax
        run: |
          python - <<'PY'
          from app.ui.card_client_experience import CARD_CLIENT_EXPERIENCE_SCRIPT
          with open('/tmp/test167-card-client.js', 'w', encoding='utf-8') as fh:
              fh.write('(() => {\n')
              fh.write(CARD_CLIENT_EXPERIENCE_SCRIPT)
              fh.write('\n})();\n')
          PY
          node --check /tmp/test167-card-client.js

      - name: Focused card client experience
        run: pytest -q tests/test_authenticated_card_client_experience.py tests/test_authenticated_visual_theme.py tests/test_authenticated_user_presentation.py

      - name: Lifecycle and conversation regression
        run: pytest -q tests/test_authenticated_guided_workflow_workspace.py tests/test_authenticated_lifecycle_v2_workspace.py tests/test_authenticated_conversation_content_workspace.py tests/test_text_import.py tests/test_text_import_auto_order.py tests/test_text_import_contract.py

      - name: Authenticated UI regression
        run: pytest -q tests/test_authenticated_*.py

      - name: Full suite
        run: pytest -q
