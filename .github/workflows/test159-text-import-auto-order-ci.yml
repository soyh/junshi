name: TEST-159 Text Import Auto Order CI

on:
  push:
    branches:
      - test-159-text-import-auto-order

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Focused text import tests
        run: pytest -q tests/test_text_import.py tests/test_text_import_contract.py tests/test_text_import_auto_order.py tests/test_authenticated_conversation_content_workspace.py

      - name: Authenticated UI regression
        run: pytest -q tests/test_authenticated_*.py

      - name: Full suite
        run: pytest -q
