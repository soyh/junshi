name: TEST-107 validation

on:
  push:
    branches:
      - test-107-provider-connection-test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: pytest -q backend/tests/test_llm_provider_connection.py backend/tests/test_llm_provider_connection_http.py
      - run: pytest -q
