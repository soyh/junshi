name: TEST-141 validation

on:
  push:
    branches:
      - test-141-action-decision-workspace

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: TEST-141 action decision workspace
        working-directory: backend
        run: pytest -q tests/test_authenticated_action_decision_workspace.py
      - name: Product workspace regression
        working-directory: backend
        run: pytest -q tests/test_authenticated_product_shell.py tests/test_authenticated_core_workspace.py tests/test_authenticated_conversation_content_workspace.py tests/test_authenticated_relationship_evidence_workspace.py tests/test_authenticated_strategy_recommendation_workspace.py tests/test_authenticated_action_plan_workspace.py
      - name: Action decision canonical regression
        working-directory: backend
        run: pytest -q tests/test_action_decision.py tests/test_action_decision_proposal_gate.py
      - name: Execution separation gates
        working-directory: backend
        run: pytest -q tests/test_execution_decision_gate.py tests/test_execution_scope_isolation.py
      - name: Action plan persistence regression
        working-directory: backend
        run: pytest -q tests/test_action_plan_persistence_gate.py tests/test_action_plan_snapshot_isolation.py
      - name: Account bearer scope regression
        working-directory: backend
        run: pytest -q tests/test_auth_account_login.py
      - name: Full test suite from server-equivalent cwd
        working-directory: backend
        run: pytest -q
