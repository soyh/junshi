name: TEST-147 final handover state

on:
  push:
    branches:
      - test-147-full-lifecycle-release-acceptance
    paths:
      - .github/workflows/test-147-final-state.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test-147-full-lifecycle-release-acceptance
          fetch-depth: 0
      - name: Update handover status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('DEVELOPMENT_HANDOVER.md')
          text = path.read_text(encoding='utf-8')
          a = 'PENDING。服务器必须验证：'
          b = '2026-09-19 已完成并通过。以下为当时的服务器验收清单，现均已满足：'
          if a not in text:
              raise SystemExit('pending marker not found')
          text = text.replace(a, b, 1)
          a = 'TEST-147 只有上述服务器验收全部通过后才可标记 VERIFIED。'
          b = '上述服务器验收已经全部通过，TEST-147 已正式标记 VERIFIED；详细实测证据见本文末尾正式 VERIFIED 记录。'
          if a not in text:
              raise SystemExit('verification condition marker not found')
          text = text.replace(a, b, 1)
          a = '当前不创建 TEST-148。TEST-147 server VERIFIED 后，产品业务闭环与 release acceptance 基线即完整闭合。若进入实际发布，必须执行已 VERIFIED 的 TEST-134 release runbook；若继续新增阶段，必须先审计新的真实产品/运维缺口，不得为了延长 TEST 编号重复实现既有能力。'
          b = '当前不创建 TEST-148。TEST-147 已 VERIFIED，产品业务闭环与 release acceptance 基线已经完整闭合。若进入实际发布，必须在用户明确要求后执行已 VERIFIED 的 TEST-134 release runbook；若继续新增阶段，必须先审计新的真实产品/运维缺口，不得为了延长 TEST 编号重复实现既有能力。'
          if a not in text:
              raise SystemExit('next-stage marker not found')
          text = text.replace(a, b, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and self-delete
        shell: bash
        run: |
          rm -f .github/workflows/test-147-final-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOVER.md .github/workflows/test-147-final-state.yml
          git diff --cached --check
          git commit -m "docs: finalize TEST-147 handover state"
          git push origin HEAD:test-147-full-lifecycle-release-acceptance
