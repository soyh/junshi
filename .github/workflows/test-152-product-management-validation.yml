name: TEST-152 product management completeness validation

on:
  push:
    branches:
      - test-152-product-management-completeness

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: TEST-152 focused product management
        working-directory: backend
        run: python -m pytest -q tests/test_authenticated_product_management_workspace.py
      - name: Authenticated product and CRUD regression
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_authenticated_product_management_workspace.py \
            tests/test_authenticated_core_workspace.py \
            tests/test_authenticated_conversation_content_workspace.py \
            tests/test_authenticated_relationship_evidence_workspace.py \
            tests/test_authenticated_strategy_recommendation_workspace.py \
            tests/test_authenticated_action_plan_workspace.py \
            tests/test_authenticated_action_decision_workspace.py \
            tests/test_authenticated_action_execution_workspace.py \
            tests/test_authenticated_action_outcome_workspace.py \
            tests/test_authenticated_action_feedback_workspace.py \
            tests/test_authenticated_action_learning_workspace.py \
            tests/test_authenticated_action_reanalysis_workspace.py \
            tests/test_persons.py \
            tests/test_relationships.py \
            tests/test_conversations.py \
            tests/test_interactions.py \
            tests/test_messages.py \
            tests/test_auth_password_change.py
      - name: Full regression
        working-directory: backend
        run: python -m pytest -q
      - name: Diff check
        run: git diff --check
