name: TEST-206 Latest Turn Recovery CI
on:
  push:
    branches: [test-206-latest-turn-recovery]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Protect verified boundaries
        run: test -z "$(git -C .. diff --name-only fb9d996bb11ed8b86a45b66035bf3c5864905ca4 HEAD -- backend/migrations backend/requirements.txt deploy)"
      - name: Focused
        run: pytest -q tests/test_206_latest_turn_recovery.py tests/test_strategic_reply_freshness.py tests/test_205_reply_freshness.py tests/test_204_long_history_budget.py tests/test_analysis_strategic_reply.py tests/test_strategic_reply_llm.py tests/test_authenticated_reply_generation_recovery.py tests/test_qwen_provider.py
      - name: Full suite
        run: pytest -q
      - name: Browser acceptance
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          PYTHONPATH=. python tests/latest_turn_recovery_browser.py
          PYTHONPATH=. python tests/reply_freshness_browser.py
          PYTHONPATH=. python tests/china_time_browser.py
          PYTHONPATH=. python tests/named_chat_import_browser.py
