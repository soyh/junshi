name: TEST-146 validation

on:
  push:
    branches:
      - test-146-reanalysis-workspace

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: TEST-146 Re-analysis workspace
        working-directory: backend
        run: pytest -q tests/test_authenticated_action_reanalysis_workspace.py
      - name: Product workspace regression through TEST-145
        working-directory: backend
        run: pytest -q tests/test_authenticated_product_shell.py tests/test_authenticated_core_workspace.py tests/test_authenticated_conversation_content_workspace.py tests/test_authenticated_relationship_evidence_workspace.py tests/test_authenticated_strategy_recommendation_workspace.py tests/test_authenticated_action_plan_workspace.py tests/test_authenticated_action_decision_workspace.py tests/test_authenticated_action_execution_workspace.py tests/test_authenticated_action_outcome_workspace.py tests/test_authenticated_action_feedback_workspace.py tests/test_authenticated_action_learning_workspace.py
      - name: Canonical Outcome Learning Re-analysis closure
        working-directory: backend
        run: pytest -q tests/test_outcome_reanalysis_closure.py tests/test_analysis_learning_strategy_bridge.py tests/test_analysis_llm_service.py tests/test_analysis_recommendation.py tests/test_recommendation_learning_strategy_bridge.py tests/test_strategy_recommendation_candidate.py
      - name: Learning and unknown-preservation regression
        working-directory: backend
        run: pytest -q tests/test_learning_strategy_context.py tests/test_learning_strategy_synthesis.py tests/test_action_feedback_learning.py tests/test_action_feedback_learning_synthesis.py tests/test_memory_learning_synthesis.py tests/test_memory_persistence.py
      - name: Provider and route boundary regression
        working-directory: backend
        run: pytest -q tests/test_analysis_structured_route.py tests/test_analysis_strategy_route.py tests/test_llm_provider_error_contract.py tests/test_llm_provider_log_redaction.py tests/test_llm_provider_runtime_routing.py tests/test_auth_account_login.py
      - name: Combined TEST-146 targeted validation
        working-directory: backend
        run: pytest -q tests/test_authenticated_action_reanalysis_workspace.py tests/test_authenticated_product_shell.py tests/test_authenticated_core_workspace.py tests/test_authenticated_conversation_content_workspace.py tests/test_authenticated_relationship_evidence_workspace.py tests/test_authenticated_strategy_recommendation_workspace.py tests/test_authenticated_action_plan_workspace.py tests/test_authenticated_action_decision_workspace.py tests/test_authenticated_action_execution_workspace.py tests/test_authenticated_action_outcome_workspace.py tests/test_authenticated_action_feedback_workspace.py tests/test_authenticated_action_learning_workspace.py tests/test_outcome_reanalysis_closure.py tests/test_analysis_learning_strategy_bridge.py tests/test_analysis_llm_service.py tests/test_analysis_recommendation.py tests/test_recommendation_learning_strategy_bridge.py tests/test_strategy_recommendation_candidate.py tests/test_learning_strategy_context.py tests/test_learning_strategy_synthesis.py tests/test_action_feedback_learning.py tests/test_action_feedback_learning_synthesis.py tests/test_memory_learning_synthesis.py tests/test_memory_persistence.py tests/test_analysis_structured_route.py tests/test_analysis_strategy_route.py tests/test_llm_provider_error_contract.py tests/test_llm_provider_log_redaction.py tests/test_llm_provider_runtime_routing.py tests/test_auth_account_login.py
      - name: Full test suite from server-equivalent cwd
        working-directory: backend
        run: pytest -q
