name: Publish Android 1.0.0 final documentation
on:
  push:
    branches: [publish-android100-documents]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9f9e1f82e19211322655d96621a9996e0d5dd4d1
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            fs.mkdirSync('release-files');
            await exec.exec('git',['archive','--format=zip','--output=release-files/project-source-android-1.0.0-final.zip','HEAD']);
            await exec.exec('git',['archive','--format=zip','--output=release-files/project-documents-android-1.0.0-final.zip','HEAD','docs','README.md','android/RELEASE.md','android/README.md','desktop/CLIENT_README.txt','release.json']);
            const files=fs.readdirSync('release-files');
            fs.writeFileSync('release-files/SHA256SUMS-FINAL.txt',files.map(n=>crypto.createHash('sha256').update(fs.readFileSync('release-files/'+n)).digest('hex')+'  '+n).join('\n')+'\n');
            const release=(await github.rest.repos.getReleaseByTag({...context.repo,tag:'android-v1.0.0'})).data;
            if(release.draft||release.prerelease)throw new Error('Official APK not yet published');
            const assets=(await github.rest.repos.listReleaseAssets({...context.repo,release_id:release.id})).data;
            for(const name of fs.readdirSync('release-files')){if(assets.some(x=>x.name===name))throw new Error('Do not overwrite published documents');const bytes=fs.readFileSync('release-files/'+name);await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name,data:bytes,headers:{'content-type':'application/octet-stream','content-length':bytes.length}});}
            await github.rest.repos.updateRelease({...context.repo,release_id:release.id,body:release.body+'\n\n主分支已同步正式版安装、固定签名及后续更新说明；最新完整源码和文档为 *-final.zip，并附 SHA256SUMS-FINAL.txt。正式 APK 保持原校验值不变。'});
