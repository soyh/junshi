name: TEST-147 handover record

on:
  push:
    branches:
      - test-147-full-lifecycle-release-acceptance

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonical handover
        run: python .github/test147_update_handover.py
      - name: Commit canonical handover and remove temporary helpers
        run: |
          git config user.name "soyh"
          git config user.email "1227448394@qq.com"
          git rm .github/workflows/test-147-handover.yml
          git rm .github/test147_update_handover.py
          git rm -f .github/test147-handover-trigger.txt || true
          git add DEVELOPMENT_HANDOVER.md
          git diff --cached --check
          git commit -m "docs: record TEST-147 GitHub acceptance"
          git push origin HEAD:test-147-full-lifecycle-release-acceptance
