name: TEST-137 validation

on:
  push:
    branches:
      - test-137-conversation-content-workspace

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: TEST-137 conversation content workspace
        working-directory: backend
        run: pytest -q tests/test_authenticated_conversation_content_workspace.py
      - name: Product shell and core workspace regression
        working-directory: backend
        run: pytest -q tests/test_authenticated_product_shell.py tests/test_authenticated_core_workspace.py
      - name: Canonical messages and text import regression
        working-directory: backend
        run: pytest -q tests/test_messages.py tests/test_text_import.py tests/test_text_import_contract.py
      - name: Account bearer scope regression
        working-directory: backend
        run: pytest -q tests/test_auth_account_login.py
      - name: Full test suite from server-equivalent cwd
        working-directory: backend
        run: pytest -q
