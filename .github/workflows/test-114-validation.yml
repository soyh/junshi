name: TEST-114 validation

on:
  push:
    branches:
      - test-114-production-auth-boundary

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Targeted production auth boundary tests
        run: pytest -q backend/tests/test_auth_boundary.py
      - name: Provider settings UI auth regression
        run: pytest -q backend/tests/test_llm_provider_settings_ui.py
      - name: Existing provider security regression
        run: pytest -q backend/tests/test_llm_provider_log_redaction.py backend/tests/test_llm_provider_config.py
      - name: Full test suite
        run: pytest -q
