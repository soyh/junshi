name: TEST-122 validation

on:
  push:
    branches:
      - test-122-legacy-user-header-retirement

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: TEST-122 legacy header retirement
        run: pytest -q backend/tests/test_auth_legacy_header_retirement.py
      - name: Production auth regression
        run: pytest -q backend/tests/test_auth_boundary.py
      - name: Bootstrap retirement regression
        run: pytest -q backend/tests/test_auth_bootstrap_retirement.py
      - name: Auth session regression
        run: pytest -q backend/tests/test_auth_session_boundary.py
      - name: Session management regression
        run: pytest -q backend/tests/test_auth_session_management.py
      - name: Account login regression
        run: pytest -q backend/tests/test_auth_account_login.py
      - name: Password change regression
        run: pytest -q backend/tests/test_auth_password_change.py
      - name: Auth UI regression
        run: pytest -q backend/tests/test_auth_account_ui.py
      - name: Scope isolation regression
        run: pytest -q backend/tests/test_execution_scope_isolation.py backend/tests/test_action_plan_snapshot_isolation.py
      - name: Full test suite
        run: pytest -q
