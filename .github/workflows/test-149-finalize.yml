name: TEST-149 finalize handover

on:
  push:
    branches:
      - test-149-runtime-health-watchdog

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-149-runtime-health-watchdog
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Finalize handover and self-clean
        run: |
          python scripts/test149_finalize_handover.py
          rm -f scripts/test149_finalize_handover.py
          rm -f .github/workflows/test-149-finalize.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: finalize TEST-149 verification handover"
          git push origin HEAD:test-149-runtime-health-watchdog
