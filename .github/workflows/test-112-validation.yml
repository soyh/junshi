name: TEST-112 validation

on:
  push:
    branches:
      - test-112-provider-log-redaction-contract

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Targeted log redaction tests
        run: pytest -q backend/tests/test_llm_provider_log_redaction.py
      - name: Existing provider config tests
        run: pytest -q backend/tests/test_llm_provider_config.py backend/tests/test_llm_provider_runtime_materialization.py
      - name: Existing provider error tests
        run: pytest -q backend/tests/test_llm_provider_error_contract.py backend/tests/test_llm_provider_connection.py
      - name: Full test suite
        run: pytest -q
