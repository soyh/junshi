name: TEST-162 Simplified Lifecycle CI

on:
  push:
    branches:
      - test-162-simplified-lifecycle-workflow

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Focused lifecycle tests
        run: pytest -q tests/test_authenticated_lifecycle_v2_workspace.py tests/test_authenticated_user_presentation_workspace.py tests/test_authenticated_guided_workflow_workspace.py tests/test_authenticated_conversation_content_workspace.py tests/test_authenticated_action_decision_workspace.py tests/test_authenticated_action_execution_workspace.py tests/test_authenticated_action_outcome_workspace.py

      - name: Authenticated UI regression
        run: pytest -q tests/test_authenticated_*.py

      - name: Full suite
        run: pytest -q
