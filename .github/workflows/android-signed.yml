name: Android signed release
on:
  workflow_dispatch:
  push:
    branches: [test-231-android-100-release]
permissions:
  contents: read
jobs:
  signed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Decode private signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure repository signing secrets first.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
      - name: Test and build fixed-signature release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle testDebugUnitTest lintRelease assembleRelease --stacktrace
      - name: Verify signature and package
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          OUT=android/app/build/outputs/apk/release
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT/app-release.apk" > "$OUT/signature.txt"
          keytool -exportcert -keystore "$RUNNER_TEMP/android-release.jks" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD > "$RUNNER_TEMP/signing-cert.der"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT/app-release.apk" > "$OUT/package.txt"
          python scripts/check_android_release.py "$OUT" "$RUNNER_TEMP/signing-cert.der"
          cat "$OUT/signature.txt"
          cp "$OUT/app-release.apk" "$OUT/JunshiAndroid-1.0.0.apk"
          cd "$OUT"
          sha256sum JunshiAndroid-1.0.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JunshiAndroid-1.0.0-signed
          path: |
            android/app/build/outputs/apk/release/JunshiAndroid-1.0.0.apk
            android/app/build/outputs/apk/release/release-verification.json
            android/app/build/outputs/apk/release/signature.txt
            android/app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks" "$RUNNER_TEMP/signing-cert.der"
