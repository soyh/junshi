name: TEST-104 validation

on:
  push:
    branches:
      - test-104-provider-api-contract
  pull_request:
    branches:
      - test-103-action-outcome-http-conflict

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: pytest -q backend/tests/test_llm_provider_config.py
      - run: pytest -q
