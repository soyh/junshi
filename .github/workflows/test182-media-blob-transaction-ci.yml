name: TEST-182 Media Blob Transaction CI

on:
  push:
    branches:
      - test-182-media-blob-transaction-integrity
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify no migration changes
        working-directory: .
        run: |
          if git diff --name-only 9517c95b3bd5dcd7e095e70d1e16b151cafe170d HEAD -- backend/migrations | grep -q .; then
            echo "TEST-182 must not modify migrations"
            git diff --name-only 9517c95b3bd5dcd7e095e70d1e16b151cafe170d HEAD -- backend/migrations
            exit 1
          fi
          echo "migration changes: NONE"

      - name: TEST-182 focused
        run: >-
          pytest -q
          tests/test_182_media_blob_transaction_integrity.py
          tests/test_181_media_evidence_lifecycle_integrity.py
          tests/test_180_media_upload_dual_model_settings_ui.py
          tests/test_177_media_attachments.py
          tests/test_messages.py
          tests/test_authenticated_*.py

      - name: Full suite
        run: pytest -q
