name: Android preview
on:
  push:
    branches: [test-222-android-client, test-223-android-blue-ui]
    paths: ['android/**', '.github/workflows/android-package.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-package.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and build
        working-directory: android
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: android
          script: |
            gradle connectedDebugAndroidTest --stacktrace || { adb logcat -d -s AndroidRuntime ActivityTaskManager TestRunner; exit 1; }
            adb pull /sdcard/Android/data/com.junshi.assistant/files/screenshots ../android-previews
      - uses: actions/upload-artifact@v4
        with:
          name: JunshiAndroid-223-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-check-reports
          path: android/app/build/reports
      - uses: actions/upload-artifact@v4
        with:
          name: Android-page-previews
          path: android-previews
