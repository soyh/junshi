name: Windows PC client package
on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-package.yml']
  workflow_dispatch:
  push:
    branches: [test-217-desktop-client, test-218-client-management, test-219-client-web-handoff, test-220-warm-blue-client, test-221-compact-client]
    paths: ['desktop/**', '.github/workflows/desktop-package.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r desktop/build-requirements.txt
      - run: python desktop/test_registration.py
      - run: python desktop/test_email_account.py
      - run: python desktop/test_desktop.py
      - run: python desktop/test_handoff.py
      - run: python desktop/test_preferences.py
      - run: python desktop/test_gui.py
      - run: python desktop/test_compact_layout.py
      - run: python desktop/test_management.py
      - run: python -m pip install -r backend/requirements.txt
      - run: python desktop/test_server_contract.py
      - run: python desktop/build_windows.py --output client-release
      - uses: actions/upload-artifact@v4
        with:
          name: JunshiPC-Windows-x64
          path: |
            client-release/*.zip
            client-release/*.sha256
