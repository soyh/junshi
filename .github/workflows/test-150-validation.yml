name: TEST-150 validation

on:
  push:
    branches:
      - test-150-offsite-disaster-recovery

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate installer syntax
        run: bash -n deploy/systemd/install-offsite-backup.sh
      - name: Validate systemd units
        run: systemd-analyze verify deploy/systemd/ai-love-strategist-offsite-backup.service deploy/systemd/ai-love-strategist-offsite-backup.timer
      - name: TEST-150 focused
        working-directory: backend
        run: python -m pytest -q tests/test_offsite_disaster_recovery.py
      - name: Operations regression
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_offsite_disaster_recovery.py
          tests/test_backup_manifest_retention.py
          tests/test_systemd_operational_hardening.py
          tests/test_runtime_watchdog_operational.py
          tests/test_startup_readiness_gate.py
          tests/test_release_preflight.py
          tests/test_release_runbook_contract.py
          tests/test_operations_readiness.py
      - name: Full regression
        working-directory: backend
        run: python -m pytest -q
      - name: Diff check
        run: git diff --check
