name: TEST155 Validation
on:
  push:
    branches:
      - test-155-strategic-reply-message-handoff
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: TEST-155 focused
        env:
          PYTHONPATH: backend
        run: |
          pytest -q \
            backend/tests/test_authenticated_strategic_reply_workspace.py \
            backend/tests/test_analysis_strategic_reply.py \
            backend/tests/test_analysis_strategic_reply_route.py \
            backend/tests/test_strategic_reply.py \
            backend/tests/test_strategic_reply_analysis_bridge.py \
            backend/tests/test_strategic_reply_learning_strategy_bridge.py \
            backend/tests/test_strategic_reply_decision_bridge.py
      - name: Authenticated product regression
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_authenticated_*.py backend/tests/test_persisted_learning_history.py backend/tests/test_product_management_state_sync.py
      - name: Full regression
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests
      - name: Diff check
        run: git diff --check
