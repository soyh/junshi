name: TEST-158 Visual UI CI

on:
  push:
    branches:
      - test-158-skyblue-tech-person-cards

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Focused visual theme tests
        run: pytest -q tests/test_authenticated_visual_theme_workspace.py tests/test_authenticated_guided_workflow_workspace.py

      - name: Authenticated UI regression
        run: pytest -q tests/test_authenticated_*.py

      - name: Full suite
        run: pytest -q
