name: TEST-194 Media Evidence Datetime Local CI

on:
  push:
    branches:
      - test-194-media-evidence-datetime-local
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify TEST-194 migration and dependency scope
        run: |
          migrations="$(git -C .. diff --name-only f31ba1062cc6b3a289f64596d98a7944cfab0cc8..HEAD -- backend/migrations)"
          requirements="$(git -C .. diff --name-only f31ba1062cc6b3a289f64596d98a7944cfab0cc8..HEAD -- backend/requirements.txt)"
          printf 'migration changes:\n%s\n' "$migrations"
          printf 'requirements changes:\n%s\n' "$requirements"
          test -z "$migrations"
          test -z "$requirements"

      - name: Verify editable local datetime contract
        run: |
          grep -n "sentAtInput.type = 'datetime-local'" app/ui/media_upload_workspace.py
          grep -n "sentAtInput.step = '1'" app/ui/media_upload_workspace.py
          grep -n 'clientCurrentLocalDateTimeValue' app/ui/media_upload_workspace.py
          grep -n 'clientLocalDateTimeToIsoWithOffset' app/ui/media_upload_workspace.py
          grep -n 'clientResetMediaSentAtToNow' app/ui/media_upload_workspace.py
          grep -n '证据时间（默认当前本地时间）' app/ui/media_upload_workspace.py
          python - <<'PY'
          from app.ui.routes import PRODUCT_SHELL_WITH_CONTENT_HTML

          html = PRODUCT_SHELL_WITH_CONTENT_HTML
          assert "sentAtInput.type = 'datetime-local';" in html
          assert "sentAtInput.step = '1';" in html
          assert "证据时间（默认当前本地时间）" in html
          assert "clientLocalDateTimeToIsoWithOffset" in html
          assert "clientResetMediaSentAtToNow();" in html
          assert "toISOString()" not in html
          print("TEST-194 editable local datetime contract: PASS")
          PY

      - name: Browser-like media datetime runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.ui.media_upload_workspace import MEDIA_UPLOAD_WORKSPACE_SCRIPT

          Path('/tmp/test194-media.js').write_text(
              MEDIA_UPLOAD_WORKSPACE_SCRIPT,
              encoding='utf-8',
          )
          PY
          npm install --prefix .. --no-save --no-package-lock jsdom@26.1.0
          node ../.github/scripts/test194_media_datetime_runtime.mjs /tmp/test194-media.js

      - name: TEST-194 focused
        run: >-
          pytest -q
          tests/test_194_media_evidence_datetime_local.py
          tests/test_193_settings_two_row_layout.py
          tests/test_180_media_upload_dual_model_settings_ui.py
          tests/test_authenticated_*.py

      - name: Full suite
        run: pytest -q
