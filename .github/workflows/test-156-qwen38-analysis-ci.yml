name: TEST-156 Qwen3.8 Analysis CI

on:
  push:
    branches:
      - test-156-first-user-end-to-end-validation
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Focused Qwen and analysis tests
        env:
          PYTHONPATH: backend
        run: |
          pytest -q \
            backend/tests/test_qwen_provider.py \
            backend/tests/test_analysis_llm_service.py \
            backend/tests/test_analysis_structured_route.py \
            backend/tests/test_llm_provider_capability_contract.py \
            backend/tests/test_llm_provider_config.py \
            backend/tests/test_llm_provider_connection.py \
            backend/tests/test_llm_provider_connection_http.py \
            backend/tests/test_llm_provider_error_contract.py \
            backend/tests/test_llm_provider_log_redaction.py \
            backend/tests/test_llm_provider_retry_contract.py \
            backend/tests/test_llm_provider_runtime_materialization.py \
            backend/tests/test_llm_provider_runtime_routing.py \
            backend/tests/test_llm_provider_settings_ui.py \
            backend/tests/test_llm_provider_url_contract.py

      - name: Auth regression
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_auth_*.py backend/tests/test_authenticated_*.py

      - name: Full suite
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests
