name: TEST-165 Qwen 3.7 CI

on:
  push:
    branches:
      - test-165-qwen37-nonthinking-analysis

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Focused Qwen provider tests
        run: pytest -q tests/test_qwen_provider.py

      - name: Analysis and strategic reply regression
        run: pytest -q tests/test_analysis_llm_service.py tests/test_analysis_strategic_reply.py tests/test_analysis_strategic_reply_route.py tests/test_strategic_reply_llm.py

      - name: Authenticated UI regression
        run: pytest -q tests/test_authenticated_*.py

      - name: Full suite
        run: pytest -q
