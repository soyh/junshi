name: TEST-147 validation

on:
  push:
    branches:
      - test-147-full-lifecycle-release-acceptance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: TEST-147 full lifecycle release acceptance
        working-directory: backend
        run: pytest -q tests/test_full_product_lifecycle_release_acceptance.py
      - name: Product workspace regression through TEST-146
        working-directory: backend
        run: pytest -q tests/test_authenticated_product_shell.py tests/test_authenticated_core_workspace.py tests/test_authenticated_conversation_content_workspace.py tests/test_authenticated_relationship_evidence_workspace.py tests/test_authenticated_strategy_recommendation_workspace.py tests/test_authenticated_action_plan_workspace.py tests/test_authenticated_action_decision_workspace.py tests/test_authenticated_action_execution_workspace.py tests/test_authenticated_action_outcome_workspace.py tests/test_authenticated_action_feedback_workspace.py tests/test_authenticated_action_learning_workspace.py tests/test_authenticated_action_reanalysis_workspace.py
      - name: Canonical lifecycle and safety closure
        working-directory: backend
        run: pytest -q tests/test_outcome_reanalysis_closure.py tests/test_core_engine_safety_closure.py tests/test_real_recommendation_action_decision_bridge.py tests/test_analysis_learning_strategy_bridge.py tests/test_memory_persistence.py
      - name: Release operations acceptance regression
        working-directory: backend
        run: pytest -q tests/test_release_preflight.py tests/test_release_runbook_contract.py tests/test_local_runtime_probe.py tests/test_operations_readiness.py tests/test_runtime_health.py tests/test_supervisor_runtime_contract.py tests/test_secure_uvicorn_launcher.py tests/test_sqlite_online_backup.py tests/test_sqlite_offline_restore.py tests/test_backup_manifest_retention.py tests/test_database_integrity.py tests/test_production_surface_hardening.py
      - name: Combined TEST-147 targeted validation
        working-directory: backend
        run: pytest -q tests/test_full_product_lifecycle_release_acceptance.py tests/test_authenticated_product_shell.py tests/test_authenticated_core_workspace.py tests/test_authenticated_conversation_content_workspace.py tests/test_authenticated_relationship_evidence_workspace.py tests/test_authenticated_strategy_recommendation_workspace.py tests/test_authenticated_action_plan_workspace.py tests/test_authenticated_action_decision_workspace.py tests/test_authenticated_action_execution_workspace.py tests/test_authenticated_action_outcome_workspace.py tests/test_authenticated_action_feedback_workspace.py tests/test_authenticated_action_learning_workspace.py tests/test_authenticated_action_reanalysis_workspace.py tests/test_outcome_reanalysis_closure.py tests/test_core_engine_safety_closure.py tests/test_real_recommendation_action_decision_bridge.py tests/test_analysis_learning_strategy_bridge.py tests/test_memory_persistence.py tests/test_release_preflight.py tests/test_release_runbook_contract.py tests/test_local_runtime_probe.py tests/test_operations_readiness.py tests/test_runtime_health.py tests/test_supervisor_runtime_contract.py tests/test_secure_uvicorn_launcher.py tests/test_sqlite_online_backup.py tests/test_sqlite_offline_restore.py tests/test_backup_manifest_retention.py tests/test_database_integrity.py tests/test_production_surface_hardening.py
      - name: Full test suite from server-equivalent cwd
        working-directory: backend
        run: pytest -q
