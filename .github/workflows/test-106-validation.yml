name: TEST-106 validation

on:
  push:
    branches:
      - test-106-provider-http-contract

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: pytest -q backend/tests/test_llm_provider_runtime_materialization.py backend/tests/test_qwen_provider.py
      - run: pytest -q
