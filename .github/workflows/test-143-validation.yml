name: TEST-143 validation

on:
  push:
    branches:
      - test-143-outcome-workspace

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: TEST-143 Outcome workspace
        working-directory: backend
        run: pytest -q tests/test_authenticated_action_outcome_workspace.py
      - name: Product workspace regression through TEST-142
        working-directory: backend
        run: pytest -q tests/test_authenticated_product_shell.py tests/test_authenticated_core_workspace.py tests/test_authenticated_conversation_content_workspace.py tests/test_authenticated_relationship_evidence_workspace.py tests/test_authenticated_strategy_recommendation_workspace.py tests/test_authenticated_action_plan_workspace.py tests/test_authenticated_action_decision_workspace.py tests/test_authenticated_action_execution_workspace.py
      - name: Outcome canonical and safety gates
        working-directory: backend
        run: pytest -q tests/test_action_outcome.py tests/test_action_outcome_http_conflict.py tests/test_action_outcome_idempotency.py tests/test_action_execution_bridge.py tests/test_execution_decision_gate.py tests/test_execution_scope_isolation.py
      - name: Feedback and learning separation regression
        working-directory: backend
        run: pytest -q tests/test_action_plan_feedback.py tests/test_action_plan_learning_synthesis.py tests/test_outcome_reanalysis_closure.py
      - name: Account bearer scope regression
        working-directory: backend
        run: pytest -q tests/test_auth_account_login.py
      - name: Combined TEST-143 targeted validation
        working-directory: backend
        run: pytest -q tests/test_authenticated_action_outcome_workspace.py tests/test_authenticated_product_shell.py tests/test_authenticated_core_workspace.py tests/test_authenticated_conversation_content_workspace.py tests/test_authenticated_relationship_evidence_workspace.py tests/test_authenticated_strategy_recommendation_workspace.py tests/test_authenticated_action_plan_workspace.py tests/test_authenticated_action_decision_workspace.py tests/test_authenticated_action_execution_workspace.py tests/test_action_outcome.py tests/test_action_outcome_http_conflict.py tests/test_action_outcome_idempotency.py tests/test_action_execution_bridge.py tests/test_execution_decision_gate.py tests/test_execution_scope_isolation.py tests/test_action_plan_feedback.py tests/test_action_plan_learning_synthesis.py tests/test_outcome_reanalysis_closure.py tests/test_auth_account_login.py
      - name: Full test suite from server-equivalent cwd
        working-directory: backend
        run: pytest -q
