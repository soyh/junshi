name: TEST-166 Conversation Content CI

on:
  push:
    branches:
      - test-166-conversation-content-multi-session-import

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Focused conversation workspace
        run: pytest -q tests/test_authenticated_conversation_content_workspace.py tests/test_authenticated_lifecycle_v2_workspace.py tests/test_authenticated_guided_workflow_workspace.py

      - name: Text import regression
        run: pytest -q tests/test_text_import.py tests/test_text_import_auto_order.py tests/test_text_import_contract.py

      - name: Qwen 3.7 regression
        run: pytest -q tests/test_qwen_provider.py

      - name: Authenticated UI regression
        run: pytest -q tests/test_authenticated_*.py

      - name: Full suite
        run: pytest -q
