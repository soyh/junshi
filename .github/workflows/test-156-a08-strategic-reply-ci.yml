name: TEST-156 A08 Strategic Reply CI

on:
  push:
    branches:
      - test-156-first-user-end-to-end-validation
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Focused strategic reply tests
        env:
          PYTHONPATH: backend
        run: |
          pytest -q \
            backend/tests/test_analysis_strategic_reply.py \
            backend/tests/test_analysis_strategic_reply_route.py \
            backend/tests/test_strategic_reply.py \
            backend/tests/test_strategic_reply_synthesis.py \
            backend/tests/test_strategic_reply_analysis_bridge.py \
            backend/tests/test_strategic_reply_learning_strategy_bridge.py \
            backend/tests/test_strategic_reply_decision_bridge.py \
            backend/tests/test_strategic_reply_llm.py \
            backend/tests/test_qwen_provider.py \
            backend/tests/test_analysis_recommendation.py \
            backend/tests/test_recommendation_producer.py \
            backend/tests/test_authenticated_strategic_reply_workspace.py

      - name: Auth regression
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_auth_*.py backend/tests/test_authenticated_*.py

      - name: Full suite
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests
