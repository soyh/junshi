name: TEST-103 validation

on:
  push:
    branches:
      - test-103-action-outcome-http-conflict

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: pytest -q backend/tests/test_action_outcome_http_conflict.py
      - run: pytest -q
