name: TEST-139 validation

on:
  push:
    branches:
      - test-139-strategy-recommendation-workspace

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: TEST-139 strategy recommendation workspace
        working-directory: backend
        run: pytest -q tests/test_authenticated_strategy_recommendation_workspace.py
      - name: Product workspace regression
        working-directory: backend
        run: pytest -q tests/test_authenticated_product_shell.py tests/test_authenticated_core_workspace.py tests/test_authenticated_conversation_content_workspace.py tests/test_authenticated_relationship_evidence_workspace.py
      - name: Canonical strategy recommendation regression
        working-directory: backend
        run: pytest -q tests/test_analysis_strategy.py tests/test_analysis_strategy_route.py tests/test_analysis_recommendation.py tests/test_strategy_recommendation_candidate.py tests/test_recommendation.py tests/test_recommendation_producer.py
      - name: Account bearer scope regression
        working-directory: backend
        run: pytest -q tests/test_auth_account_login.py
      - name: Full test suite from server-equivalent cwd
        working-directory: backend
        run: pytest -q
