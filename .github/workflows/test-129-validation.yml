name: TEST-129 validation

on:
  push:
    branches:
      - test-129-operations-readiness

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: TEST-129 operations readiness
        run: pytest -q backend/tests/test_operations_readiness.py
      - name: TEST-128 manifest retention regression
        run: pytest -q backend/tests/test_backup_manifest_retention.py
      - name: TEST-127 restore regression
        run: pytest -q backend/tests/test_sqlite_offline_restore.py
      - name: TEST-126 backup regression
        run: pytest -q backend/tests/test_sqlite_online_backup.py
      - name: Production auth regression
        run: pytest -q backend/tests/test_auth_boundary.py
      - name: Scope isolation regression
        run: pytest -q backend/tests/test_execution_scope_isolation.py backend/tests/test_action_plan_snapshot_isolation.py
      - name: Full test suite
        run: pytest -q
