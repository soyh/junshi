name: TEST-173 Single Open Hover Interactions CI

on:
  push:
    branches:
      - test-173-single-open-hover-interactions

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Single-open nested settings focused
        run: pytest -q tests/test_authenticated_single_open_interactions.py tests/test_authenticated_card_client_experience.py tests/test_authenticated_guided_workflow_workspace.py tests/test_authenticated_account_security_workspace.py tests/test_authenticated_visual_theme_workspace.py

      - name: Authenticated UI regression
        run: pytest -q tests/test_authenticated_*.py

      - name: Full suite
        run: pytest -q
