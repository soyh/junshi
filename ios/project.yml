name: Junshi
options:
  bundleIdPrefix: com.junshi.assistant.ios
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '23201'
    JUNSHI_APP_GROUP: group.com.junshi.assistant.ios
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Junshi:
    type: application
    platform: iOS
    sources: [App, Shared, Resources/PrivacyInfo.xcprivacy]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AI 恋爱军师
        JunshiAppGroup: $(JUNSHI_APP_GROUP)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryUsageDescription: 仅在你选择时读取照片或视频，上传前由你确认人物和会话。
        NSCameraUsageDescription: 仅在你选择拍摄附件时使用相机。
        NSMicrophoneUsageDescription: 仅在你选择录制视频附件时使用麦克风。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: App/Junshi.entitlements
      properties:
        com.apple.security.application-groups: [$(JUNSHI_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junshi.assistant.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: JunshiShare
        embed: true
  JunshiShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared/API.swift, Shared/MediaIO.swift, Shared/ShareInbox.swift, Shared/DebugFixtures.swift, Resources/PrivacyInfo.xcprivacy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junshi.assistant.ios.share
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: AI 恋爱军师
        JunshiAppGroup: $(JUNSHI_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 4
              NSExtensionActivationSupportsMovieWithMaxCount: 4
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ShareExtension/JunshiShare.entitlements
      properties:
        com.apple.security.application-groups: [$(JUNSHI_APP_GROUP)]
  JunshiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{target: Junshi}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junshi.assistant.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  JunshiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{target: Junshi}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junshi.assistant.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Junshi:
    build:
      targets:
        Junshi: all
    test:
      targets: [JunshiTests, JunshiUITests]
      gatherCoverageData: true
